name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: make format
      - run: make lint

  unit-integration:
    name: Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: make test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Shells out to the real `gh`/`opencode` CLIs (see AGENTS.md/README).
    # `gh` uses the runner's default, no-setup-required GITHUB_TOKEN. The
    # agent smoke flow pins opencode/big-pickle, a free, no-API-key-needed
    # OpenCode Zen model (see https://opencode.ai/docs/zen) -- so no repo
    # secrets are required at all here, and this runs on forked PRs too.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - name: Install opencode CLI
        run: npm install --global opencode-ai
      - run: make test-e2e

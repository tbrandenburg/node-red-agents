name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: make format
      - run: make lint

  unit-integration:
    name: Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: make test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Shells out to the real `gh`/`opencode` CLIs (see AGENTS.md/README), so
    # it needs an authenticated `gh` (the runner's default GITHUB_TOKEN) and
    # an ANTHROPIC_API_KEY repo secret. Forked PRs don't get repo secrets,
    # so skip there rather than fail on missing credentials; the "skip"
    # step below also no-ops gracefully if a same-repo run has no key
    # configured yet.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - name: Check required secrets are configured
        id: preflight
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set -- skipping E2E (needs a real, billed provider key; see README Prerequisites)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install opencode CLI
        if: steps.preflight.outputs.skip != 'true'
        run: npm install --global opencode-ai
      - name: make test-e2e
        if: steps.preflight.outputs.skip != 'true'
        run: make test-e2e

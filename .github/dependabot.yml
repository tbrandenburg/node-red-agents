version: 2
updates:
  # Root npm workspace (covers packages/node-red-agents via npm workspaces --
  # it has no lockfile of its own). data/ and demo/ are intentionally not
  # listed: their package-lock.json files are gitignored/regenerable local
  # dev state (see AGENTS.md), so Dependabot has nothing durable to track
  # there.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"

  # Keep the GitHub Actions used in our own workflows (checkout, setup-node,
  # etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

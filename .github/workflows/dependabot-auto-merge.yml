name: Dependabot auto-merge

# Auto-merges Dependabot PRs, but only patch/minor bumps of dev dependencies
# or GitHub Actions -- never a production dependency, and never a major
# bump for anything (majors can carry breaking API changes and always need
# a human look). "Auto-merge" here means: request GitHub's native
# auto-merge on the PR, which still waits for the required status checks
# (Format + Lint, Unit + Integration, E2E -- see the repo's branch ruleset)
# before actually merging. Nothing here bypasses CI.

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for safe updates
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          (steps.metadata.outputs.dependency-type == 'direct:development' ||
           steps.metadata.outputs.package-ecosystem == 'github-actions')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Publish

# Triggers:
# - push of a `node-red-agents@X.Y.Z` tag (created by `make release`): real publish + GitHub Release.
# - workflow_dispatch: manual run, dry_run=true by default (no publish, no release).
# - pull_request touching this file: harness-only validation (checkout, setup-node, test,
#   `npm pack --dry-run`) -- never touches npm auth or creates a release, so it's safe on forks/PRs.

on:
  push:
    tags:
      - "node-red-agents@*"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish/gh release in dry-run mode (no publish, no release)"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_DIR: packages/node-red-agents

jobs:
  publish:
    name: Publish node-red-agents to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
      id-token: write # OIDC trusted publishing to npm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # need full history/tags for the tag<->tree guard below

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Resolve version, tag and dry-run mode
        id: vars
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./${PACKAGE_DIR}/package.json').version")
          TAG="node-red-agents@${VERSION}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ inputs.dry_run }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            DRY_RUN="false"
            if [ "${{ github.ref_name }}" != "$TAG" ]; then
              echo "::error::Pushed tag '${{ github.ref_name }}' does not match package.json version '$TAG'."
              exit 1
            fi
          else
            echo "::error::Unsupported trigger for publish workflow."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG dry_run=$DRY_RUN"

      - name: Verify tag matches package tree (skipped when tag does not exist yet, e.g. dry-run dispatch on a branch)
        if: github.event_name != 'pull_request' && (steps.vars.outputs.dry_run == 'false' || steps.vars.outputs.tag != '')
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "${{ steps.vars.outputs.dry_run }}" = "false" ]; then
              echo "::error::Tag ${TAG} not found -- refusing to publish."
              exit 1
            fi
            echo "Tag ${TAG} does not exist yet (expected during a dry-run dispatch on a branch) -- skipping tree check."
            exit 0
          fi
          TAG_TREE=$(git rev-parse "${TAG}:${PACKAGE_DIR}")
          HEAD_TREE=$(git rev-parse "HEAD:${PACKAGE_DIR}")
          if [ "$TAG_TREE" != "$HEAD_TREE" ]; then
            echo "::error::${PACKAGE_DIR} at HEAD does not match what ${TAG} tagged -- aborting publish."
            exit 1
          fi
          echo "Tag ${TAG} tree matches HEAD:${PACKAGE_DIR}."

      - run: npm ci

      - run: make test

      - name: npm pack dry-run sanity check
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm pack --dry-run

      - name: npm publish
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm publish --access public ${{ steps.vars.outputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && steps.vars.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- skipping creation."
            exit 0
          fi
          gh release create "$TAG" --generate-notes --title "$TAG"
